<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<style>
  body{margin:0;background:#fbfaf7;color:#1f1d1a;font-family:Assistant,"Segoe UI",Arial,sans-serif;font-size:18px;line-height:1.7}
  main{max-width:760px;margin:0 auto;padding:40px 20px 80px}
  h1,h2,h3{line-height:1.3}
  table{border-collapse:collapse;width:100%;margin:1em 0;display:block;overflow-x:auto}
  th,td{border:1px solid #d9d4ca;padding:8px 12px;text-align:right;vertical-align:top}
  th{background:#f0ece3}
  code{background:#f0ece3;padding:1px 5px;border-radius:4px;font-size:.9em;direction:ltr;unicode-bidi:embed}
  [dir=ltr] th,[dir=ltr] td{text-align:left}
  a{color:#5b4a8a}
</style>
</head>
<body><main>{{ content }}</main></body>
</html>
